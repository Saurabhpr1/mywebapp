name: Docker build pipeline
on:
  push:
    branches:
      - main
jobs:
  docker_job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v3
      - name: check version of docker
        run: docker --version
      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build docker image
        run: docker build -t saurabhpraja/app_code_repo:v1 .
      - name: push to docker hub
        run: docker push saurabhpraja/app_code_repo:vi
      - name: Deploy Docker container on Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull saurabhpraja/app_code_repo:v1
            docker run -d --name app_code-container -p 8243:80 saurabhpraja/app_code_repo:v1
          
